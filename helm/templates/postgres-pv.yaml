apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
spec:
  capacity:
    storage: 8Gi  # Should match or exceed your PVC request
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain  # Important for database data
  storageClassName: local-storage
  hostPath:
    path: "/mnt/postgres-data"
    type: DirectoryOrCreate
# Global configuration shared between services
global:
  dbUsername: "postgres"
  dbPassword: "postgres"
  dbName: "postgres"
  dbHost: "postgres"
  dbPort: "5432"
  mlServiceHost: "ml-service"
  mlServicePort: "8080"

# Postgres settings
postgres:
  enabled: true
  image: "postgres:15"
  port: 5432
  persistence:
    enabled: true
    size: 1Gi
    storageClass: local-storage

# Backend settings
backend:
  enabled: true
  image: wignorbo/backend:latest
  port: 8000
  test:
    enabled: false
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    metricType: cpu
    targetAverageUtilization: 15
    enabled: true

# ML Service settings
mlService:
  enabled: true
  image: wignorbo/ml_service:latest
  port: 8080
  gigachatApiKey:
  test:
    enabled: false

# Frontend settings
frontend:
  enabled: true
  image: wignorbo/frontend:latest
  apiBaseURL: http://localhost:8000
  port: 3000


# Telegram Bot settings
tgBot:
  enabled: true
  tgToken: "" # Must be set in --set or secret
  image: wignorbo/tg_bot:latest
